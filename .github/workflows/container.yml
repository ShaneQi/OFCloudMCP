# Tests, then builds the container image (amd64 + arm64) and pushes it to:
#   - GitHub Container Registry: ghcr.io/<owner>/<repo> (built-in GITHUB_TOKEN)
#   - Google Artifact Registry: us-south1-docker.pkg.dev/serverless-509006/images/omnifocus-mcp
#     (needs the repository secret GCP_SA_KEY: a service account JSON key with
#     Artifact Registry Writer on the "images" repository)
#
# Tags: "latest" and "sha-<commit>" on main; the version on v* git tags.
# Pull requests are built but not pushed.
#
# On main, it then deploys the new image to the Cloud Run service below
# (only the image changes; env vars, secrets and volumes are kept). The key's
# service account needs Cloud Run Developer on the service and Service Account
# User on the service's runtime account.
name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "omnifocus-mcp/**"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "omnifocus-mcp/**"
      - ".github/workflows/container.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  GAR_REGISTRY: us-south1-docker.pkg.dev
  GAR_PROJECT_ID: serverless-509006
  GAR_REPOSITORY: images
  GAR_IMAGE: omnifocus-mcp
  CLOUD_RUN_SERVICE: omnifocus-mcp
  CLOUD_RUN_REGION: us-south1

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omnifocus-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: omnifocus-mcp/package-lock.json
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Artifact Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.GAR_REGISTRY }}/${{ env.GAR_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.GAR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=ref,event=pr
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: omnifocus-mcp
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Authenticate to Google Cloud
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2

      - name: Update the Cloud Run service to this image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project "$GAR_PROJECT_ID" --region "$CLOUD_RUN_REGION" \
            --image "$GAR_REGISTRY/$GAR_PROJECT_ID/$GAR_REPOSITORY/$GAR_IMAGE@${{ steps.build.outputs.digest }}" \
            --quiet
