# Tests, then builds the container image and pushes it to GitHub Container
# Registry as ghcr.io/<owner>/<repo> (lowercase), for amd64 and arm64.
#
# Tags: "latest" and "sha-<commit>" on main; the version on v* git tags.
# Pull requests are built but not pushed. Uses the built-in GITHUB_TOKEN;
# no extra secrets needed.
name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "omnifocus-mcp/**"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "omnifocus-mcp/**"
      - ".github/workflows/container.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omnifocus-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: omnifocus-mcp/package-lock.json
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: omnifocus-mcp
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
