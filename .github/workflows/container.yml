# Tests, then builds the container image (amd64 + arm64) and pushes it to:
#   - GitHub Container Registry: ghcr.io/<owner>/<repo> (built-in GITHUB_TOKEN)
#   - Google Artifact Registry, when configured:
#       <GAR_LOCATION>-docker.pkg.dev/<GCP_PROJECT_ID>/<GAR_REPOSITORY>/<GAR_IMAGE>
#
# Tags: "latest" and "sha-<commit>" on main; the version on v* git tags.
# Pull requests are built but not pushed.
#
# Artifact Registry settings (Settings → Secrets and variables → Actions):
#   Variables: GCP_PROJECT_ID, GAR_LOCATION (e.g. us-central1),
#              GAR_REPOSITORY (e.g. containers), GAR_IMAGE (default omnifocus-mcp)
#   Auth, either Workload Identity Federation (recommended, no key):
#     Variables: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
#   or a service account key:
#     Secret: GCP_SA_KEY (JSON)
# If GCP_PROJECT_ID is unset, only GHCR is used.
name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "omnifocus-mcp/**"
      - ".github/workflows/container.yml"
  pull_request:
    paths:
      - "omnifocus-mcp/**"
      - ".github/workflows/container.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write # Workload Identity Federation to Google Cloud

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omnifocus-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: omnifocus-mcp/package-lock.json
      - run: npm ci
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Artifact Registry settings
        id: gar
        if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
        env:
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          LOCATION: ${{ vars.GAR_LOCATION }}
          REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          IMAGE: ${{ vars.GAR_IMAGE || 'omnifocus-mcp' }}
          WIF: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$LOCATION" ] || [ -z "$REPOSITORY" ]; then
            echo "::error::Set GAR_LOCATION and GAR_REPOSITORY (with GCP_PROJECT_ID)."; exit 1
          fi
          if [ -n "$WIF" ]; then echo "auth=wif" >> "$GITHUB_OUTPUT"
          elif [ -n "$KEY" ]; then echo "auth=key" >> "$GITHUB_OUTPUT"
          else echo "::error::Set GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT, or the GCP_SA_KEY secret."; exit 1
          fi
          echo "registry=$LOCATION-docker.pkg.dev" >> "$GITHUB_OUTPUT"
          echo "image=$LOCATION-docker.pkg.dev/$PROJECT/$REPOSITORY/$IMAGE" >> "$GITHUB_OUTPUT"

      - id: gcp-wif
        if: steps.gar.outputs.auth == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - id: gcp-key
        if: steps.gar.outputs.auth == 'key'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: access_token

      - uses: docker/login-action@v3
        if: steps.gar.outputs.registry != ''
        with:
          registry: ${{ steps.gar.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-wif.outputs.access_token || steps.gcp-key.outputs.access_token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ steps.gar.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: omnifocus-mcp
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
